databaseChangeLog:
  - changeSet:
      id: 01-14062026-add-admins-table.yaml
      author: Jahangir Alisoy
      changes:
        - createTable:
            tableName: admins
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(255)
                  defaultValue: 'ADMIN'
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false