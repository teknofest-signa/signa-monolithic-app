databaseChangeLog:
  - changeSet:
      id: 05-14062026-add-accounts-table
      author: Jahangir Alisoy
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: balance
                  type: DECIMAL(19,4)
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: account_status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false