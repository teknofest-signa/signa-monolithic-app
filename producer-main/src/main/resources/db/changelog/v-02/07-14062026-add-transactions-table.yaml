databaseChangeLog:
  - changeSet:
      id: 07-14062026-add-transactions-table
      author: Jahangir Alisoy
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to_account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false