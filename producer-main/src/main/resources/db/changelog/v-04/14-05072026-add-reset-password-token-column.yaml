databaseChangeLog:
  - changeSet:
      id: 14-05072026-add-reset-password-token-columns
      author: Jahangir Alisoy
      changes:
        - addColumn:
            tableName: admins
            columns:
              - column:
                  name: reset_password_token
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: reset_password_token_created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true